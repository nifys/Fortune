<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ФОРТУНА ОТ NIFY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Audiowide&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop-glow glow-1"></div>
    <div class="backdrop-glow glow-2"></div>

    <main class="app">
      <div class="panel">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark">✦</span>
            <span>ФОРТУНА ОТ NIFY</span>
          </div>
        </div>

        <section class="oracle">
          <div class="field-wrap">
            <label for="question">пиздани как сократ</label>
            <input
              id="question"
              type="text"
              placeholder="Что тебя ждёт..."
              maxlength="100"
            />
          </div>

          <button id="askBtn" class="ask-btn">ГАДАЙ</button>
        </section>

        <section class="playground">
          <div class="lane">
            <div class="lane-track"></div>
            <div class="ball-container" id="ballContainer">
              <div class="ball" id="ball">
                <div class="ball-stripes"></div>
                <span class="ball-number">67</span>
              </div>
            </div>
            <div class="finish-line"></div>
          </div>

          <div class="result-box" id="resultBox">
            <div class="result-label">ТВОЯ СУДЬБА</div>
            <div class="result-text" id="resultText">50/50</div>
          </div>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
